name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install zxing-cpp pillow tkinterdnd2 pyinstaller

      - name: Run decode self-test
        run: python test_decode.py

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon app.ico --name QReader qr_reader.py

      - name: Rename exe with version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' qr_reader.py)
          mv dist/QReader.exe "dist/QReader-$VERSION.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ github.run_number }}
          path: dist/QReader-*.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QReader-*.exe
          generate_release_notes: true
